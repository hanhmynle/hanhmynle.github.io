<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Name</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <h1>Your Name</h1>
  </header>

  <main>

    <!-- 1. Intro — no heading -->
    <p>
      I am [your role, e.g. a PhD candidate] in [field] at [institution],
      working on [1–2 sentences about your research interests].
    </p>

    <!-- 2. CV link — no heading -->
    <p><a href="cv.pdf" target="_blank" rel="noopener">CV</a></p>

    <!-- 3. Research — heading + list of working papers -->
    <h2>Research</h2>
    <ul>
      <li><a href="papers/paper-one.pdf" target="_blank" rel="noopener">"Working Paper Title One" (Year)</a></li>
      <li><a href="papers/paper-two.pdf" target="_blank" rel="noopener">"Working Paper Title Two" (Year)</a></li>
      <li><a href="papers/paper-three.pdf" target="_blank" rel="noopener">"Working Paper Title Three" (Year)</a></li>
    </ul>

  </main>

  <footer>
    &copy; <span id="year"></span> Your Name
  </footer>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>

</body>
</html>
